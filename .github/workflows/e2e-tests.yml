name: End-to-end Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Start Neo4j
      run: |
        docker run --name neo4j-test -p 7687:7687 -p 7474:7474 -e NEO4J_AUTH=neo4j/neo4jpassword -d neo4j:5

    - name: Run end-to-end tests
      run: |
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh e2e
