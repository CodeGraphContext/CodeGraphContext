name: End-to-end Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs of the SAME pull request only; pushes to main and
# scheduled runs are never cancelled (#1326).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Small fixtures; a large pool made LadybugDB fault on constrained runners
env:
  CGC_EMBEDDED_BUFFER_POOL_MB: "1024"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run end-to-end tests
      shell: bash
      run: |
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh e2e
