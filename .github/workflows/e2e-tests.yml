name: End-to-end Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: "neo4j/neo4jpassword"
        options: >
          --health-cmd "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
        pip install toml

    - name: Add default config for tests
      run: cp pyproject.toml tests/fixtures/sample_projects/pyproject.toml

    - name: Wait for Neo4j to be ready
      run: |
        for i in {1..30}; do
          nc -z localhost 7687 && echo "Neo4j is up" && break
          echo "Waiting for Neo4j..."
          sleep 2
        done
        pip install -e .[dev]

    - name: Run end-to-end tests
      run: |
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh e2e
