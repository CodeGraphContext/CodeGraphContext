name: Build Test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:  

# Cancel superseded runs of the SAME pull request only; pushes to main and
# scheduled runs are never cancelled (#1326).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deterministic pool for CI. 2 GiB: ladybug 0.20.x exhausts a 1 GiB pool on
  # the parity fixture, while the unconstrained 4 GiB default faulted natively
  # on runners sharing memory with the Neo4j container.
env:
  CGC_EMBEDDED_BUFFER_POOL_MB: "2048"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install .[dev,parsing]

      - name: Build package
        run: python -m build

      - name: Run Unit and Integration Tests
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh fast
