name: Build and Release Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: cgc-linux-x86_64
          - os: windows-latest
            artifact_name: cgc-windows.exe
          - os: macos-latest
            artifact_name: cgc-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'


      - name: Install dependencies (Windows/Mac)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install .[parsing]
          pip install pyinstaller
          # Only install extra runtime dependencies not covered by [parsing] extras
          pip install redislite
          # falkordb is not on PyPI; falkordblite is its replacement for Python 3.12+

      - name: Build with PyInstaller (Windows/Mac)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pyinstaller cgc.spec --clean

      - name: Build with PyInstaller (Linux - Manylinux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -c "
              set -e
              cd /src
              yum install -y python3 python3-devel
              python3 -m pip install --upgrade pip
              pip3 install .[parsing] pyinstaller
              # Only install extra runtime dependencies not covered by [parsing] extras
              pip3 install redislite
              # falkordb is not on PyPI; falkordblite is its replacement for Python 3.12+
              pyinstaller cgc.spec --clean
            "
          sudo chown -R $USER:$USER dist build

      - name: Rename artifact (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/cgc dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: move dist\cgc.exe dist\${{ matrix.artifact_name }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cgc-linux-x86_64/cgc-linux-x86_64
            artifacts/cgc-windows.exe/cgc-windows.exe
            artifacts/cgc-macos-arm64/cgc-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
