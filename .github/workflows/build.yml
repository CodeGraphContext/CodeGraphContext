name: Build and Release Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: cgc-linux-x86_64
          - os: windows-latest
            artifact_name: cgc-windows.exe
          - os: macos-latest
            artifact_name: cgc-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies (Windows/Mac)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller (Windows/Mac)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pyinstaller cgc.spec --clean

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install .
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller cgc.spec --clean

      - name: Rename artifact (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/cgc dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: move dist\cgc.exe dist\${{ matrix.artifact_name }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  package-vsix:
    name: Package VS Code extension with bundled Windows binary
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download cgc-windows.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: cgc-windows.exe
          path: extensions/vscode/bin

      - name: Install extension deps
        working-directory: extensions/vscode
        run: npm install

      - name: Compile TypeScript
        working-directory: extensions/vscode
        run: npm run compile

      - name: Package VSIX (binary already in place, skip fetch)
        working-directory: extensions/vscode
        env:
          CGC_BINARY_SKIP: '1'
        run: npx @vscode/vsce package --allow-star-activation -o cgc-vscode.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: cgc-vscode-vsix
          path: extensions/vscode/cgc-vscode.vsix

  release:
    name: Create Release
    needs: [build, package-vsix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cgc-linux-x86_64/cgc-linux-x86_64
            artifacts/cgc-windows.exe/cgc-windows.exe
            artifacts/cgc-macos-arm64/cgc-macos-arm64
            artifacts/cgc-vscode-vsix/cgc-vscode.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
