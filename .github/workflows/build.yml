name: Build and Release Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: cgc-linux-x86_64
          - os: windows-latest
            artifact_name: cgc-windows.exe
          - os: macos-latest
            artifact_name: cgc-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'



      - name: Ensure extra dependencies and check directories (Windows/Mac)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[parsing]
          pip install "pyinstaller>=5.13"
          # Optionally check for directories (will not fail if missing)
          if [ ! -d tree_sitter_c_sharp ]; then echo "tree_sitter_c_sharp directory not found, skipping clone"; fi
          if [ ! -d kuzu ]; then echo "kuzu directory not found, skipping clone"; fi

      - name: Install redislite (Non-Windows only)
        if: runner.os != 'Windows'
        run: pip install redislite


      - name: Build with PyInstaller (Windows/Mac)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pyinstaller cgc.spec --clean

      - name: Build with PyInstaller (Linux - Manylinux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/cgc
          cp -r ${{ github.workspace }}/* /tmp/cgc/
          docker run --rm \
            -v /tmp/cgc:/src \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -c '
              set -e
              cd /src
              export PY=/opt/python/cp311-cp311/bin/python3
              export PIP=/opt/python/cp311-cp311/bin/pip3
              $PY -m pip install --upgrade pip

              $PIP install --upgrade setuptools wheel
              $PIP install .[parsing] "pyinstaller>=5.13"
              # Only install redislite (always non-Windows inside Docker)
              $PIP install redislite
              # Optionally check for directories (will not fail if missing)
              if [ ! -d tree_sitter_c_sharp ]; then echo "tree_sitter_c_sharp directory not found, skipping clone"; fi
              if [ ! -d kuzu ]; then echo "kuzu directory not found, skipping clone"; fi
              # falkordb is not on PyPI; falkordblite is its replacement for Python 3.12+
              $PY -m PyInstaller cgc.spec --clean
            '
          cp -r /tmp/cgc/dist ${{ github.workspace }}/dist || true
          cp -r /tmp/cgc/build ${{ github.workspace }}/build || true
          sudo chown -R $USER:$USER ${{ github.workspace }}/dist ${{ github.workspace }}/build || true

      - name: Rename artifact (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/cgc dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: move dist\cgc.exe dist\${{ matrix.artifact_name }}
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cgc-linux-x86_64/cgc-linux-x86_64
            artifacts/cgc-windows.exe/cgc-windows.exe
            artifacts/cgc-macos-arm64/cgc-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
