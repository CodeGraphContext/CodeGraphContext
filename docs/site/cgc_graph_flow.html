<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Space Mono',monospace;overflow:hidden}
.shell{background:#0e0e0e;border-radius:16px;overflow:hidden;position:relative;border:1px solid #1c1c1c}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #161616}
.tb-dots{display:flex;gap:6px}
.tb-dot{width:10px;height:10px;border-radius:50%}
.tb-dot.r{background:#ff5f57}.tb-dot.y{background:#febc2e}.tb-dot.g{background:#28c840}
.tb-title{font-size:10px;color:#333;letter-spacing:2px;margin-left:8px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-badge{font-size:9px;padding:3px 9px;border-radius:4px;letter-spacing:1px}
.live{background:rgba(220,30,30,.12);border:1px solid rgba(220,30,30,.3);color:#dc1e1e;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.nodes-badge{background:#161616;border:1px solid #222;color:#444}
canvas#gc{display:block;width:100%!important}
.sidebar{position:absolute;top:53px;right:0;bottom:0;width:210px;background:#0a0a0a;border-left:1px solid #161616;padding:16px;overflow-y:auto;transition:transform .3s;z-index:10}
.sidebar.hidden{transform:translateX(100%)}
.sb-close{position:absolute;top:10px;right:12px;background:none;border:none;color:#333;cursor:pointer;font-size:16px;line-height:1;font-family:'Space Mono',monospace}
.sb-close:hover{color:#dc1e1e}
.sb-type{font-size:9px;letter-spacing:2px;color:#444;text-transform:uppercase;margin-bottom:6px}
.sb-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:12px;word-break:break-all;line-height:1.4}
.sb-section{font-size:9px;letter-spacing:1.5px;color:#333;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.sb-conn{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #111;cursor:pointer}
.sb-conn:hover .sb-cname{color:#fff}
.sb-cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-cname{font-size:9px;color:#444;transition:color .15s}
.sb-carrow{font-size:9px;color:#2a2a2a;flex-shrink:0}
.sb-prop{font-size:9px;color:#555;padding:3px 0;border-bottom:1px solid #111}
.legend{position:absolute;bottom:14px;left:16px;display:flex;gap:12px;align-items:center;z-index:5}
.leg{display:flex;align-items:center;gap:5px;font-size:9px;color:#2e2e2e;letter-spacing:.5px}
.leg-dot{width:8px;height:8px;border-radius:50%}
.tooltip{position:absolute;background:#111;border:1px solid #222;border-radius:5px;padding:5px 10px;font-size:9px;color:#aaa;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20;white-space:nowrap}
.tooltip.show{opacity:1}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="tb-dots"><div class="tb-dot r"></div><div class="tb-dot y"></div><div class="tb-dot g"></div></div>
    <div class="tb-title">LIVE PROPERTY GRAPH</div>
    <div class="tb-right">
      <div class="tb-badge live">● LIVE</div>
      <div class="tb-badge nodes-badge">18 NODES</div>
    </div>
  </div>
  <div style="position:relative">
    <canvas id="gc"></canvas>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#e8956d"></div>project</div>
      <div class="leg"><div class="leg-dot" style="background:#e8a0c0"></div>module</div>
      <div class="leg"><div class="leg-dot" style="background:#7ecfb0"></div>function</div>
      <div class="leg"><div class="leg-dot" style="background:#7ab8e8"></div>class</div>
    </div>
    <div class="tooltip" id="tip"></div>
    <div class="sidebar hidden" id="sb">
      <button class="sb-close" onclick="closeSidebar()">✕</button>
      <div class="sb-type" id="sb-type"></div>
      <div class="sb-name" id="sb-name"></div>
      <div class="sb-section">Properties</div>
      <div id="sb-props"></div>
      <div class="sb-section">Connections</div>
      <div id="sb-conns"></div>
    </div>
  </div>
</div>
<script>
// Graph data
var nodes=[
  {id:0,label:"codegraphcontext",type:"project",x:0,y:0,vx:0,vy:0},
  {id:1,label:"cli",type:"module",x:0,y:0,vx:0,vy:0},
  {id:2,label:"indexer",type:"module",x:0,y:0,vx:0,vy:0},
  {id:3,label:"graph_builder",type:"module",x:0,y:0,vx:0,vy:0},
  {id:4,label:"backends",type:"module",x:0,y:0,vx:0,vy:0},
  {id:5,label:"mcp_server",type:"module",x:0,y:0,vx:0,vy:0},
  {id:6,label:"main()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:7,label:"index_repo()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:8,label:"parse_file()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:9,label:"build_graph()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:10,label:"query()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:11,label:"serve()",type:"function",x:0,y:0,vx:0,vy:0},
  {id:12,label:"KuzuBackend",type:"class",x:0,y:0,vx:0,vy:0},
  {id:13,label:"FalkorBackend",type:"class",x:0,y:0,vx:0,vy:0},
  {id:14,label:"Neo4jBackend",type:"class",x:0,y:0,vx:0,vy:0},
  {id:15,label:"TreeSitterParser",type:"class",x:0,y:0,vx:0,vy:0},
  {id:16,label:"GraphNode",type:"class",x:0,y:0,vx:0,vy:0},
  {id:17,label:"MCPHandler",type:"class",x:0,y:0,vx:0,vy:0}
];
var edges=[
  {s:0,t:1},{s:0,t:2},{s:0,t:3},{s:0,t:4},{s:0,t:5},
  {s:1,t:6},{s:2,t:7},{s:2,t:8},{s:3,t:9},{s:4,t:10},{s:5,t:11},
  {s:7,t:15},{s:8,t:15},{s:9,t:16},{s:10,t:12},{s:10,t:13},{s:10,t:14},{s:11,t:17},
  {s:6,t:7},{s:7,t:9},{s:9,t:10}
];
var colors={project:"#e8956d",module:"#e8a0c0","function":"#7ecfb0","class":"#7ab8e8"};
var c=document.getElementById("gc"),ctx=c.getContext("2d");
var W,H,sel=null,hov=null,drag=null,mx=0,my=0;
function resize(){var r=c.parentElement.getBoundingClientRect();W=r.width;H=Math.max(400,r.height||400);c.width=W*2;c.height=H*2;c.style.height=H+"px";ctx.scale(2,2);}
resize();
// Init positions
nodes.forEach(function(n,i){n.x=W/2+Math.cos(i*0.9)*150+Math.random()*80;n.y=H/2+Math.sin(i*0.9)*120+Math.random()*60;});
function tick(){
  nodes.forEach(function(a){nodes.forEach(function(b){if(a.id>=b.id)return;var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<120){var f=(120-d)*0.003;a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f;}});});
  edges.forEach(function(e){var a=nodes[e.s],b=nodes[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-100)*0.002;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;});
  nodes.forEach(function(n){n.vx+=(W/2-n.x)*0.0003;n.vy+=(H/2-n.y)*0.0003;n.vx*=0.92;n.vy*=0.92;if(n!==drag){n.x+=n.vx;n.y+=n.vy;}n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(30,Math.min(H-30,n.y));});
}
function draw(){
  ctx.clearRect(0,0,W,H);
  edges.forEach(function(e){var a=nodes[e.s],b=nodes[e.t];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);var hl=(sel!==null&&(e.s===sel||e.t===sel));ctx.strokeStyle=hl?"rgba(220,30,30,0.5)":"rgba(255,255,255,0.06)";ctx.lineWidth=hl?1.5:0.5;ctx.stroke();});
  nodes.forEach(function(n){var r=n.type==="project"?14:n.type==="module"?10:n.type==="class"?9:7;var isH=(hov===n.id),isS=(sel===n.id);ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=colors[n.type];ctx.globalAlpha=isS?1:isH?0.9:0.7;ctx.fill();ctx.globalAlpha=1;if(isS){ctx.strokeStyle=colors[n.type];ctx.lineWidth=2;ctx.stroke();}
  if(isH||isS||(sel!==null&&edges.some(function(e){return(e.s===sel&&e.t===n.id)||(e.t===sel&&e.s===n.id);}))){ctx.fillStyle="#aaa";ctx.font="9px 'Space Mono'";ctx.textAlign="center";ctx.fillText(n.label,n.x,n.y-r-6);}});
}
function loop(){tick();draw();requestAnimationFrame(loop);}
loop();
// Interaction
c.addEventListener("mousemove",function(ev){var r=c.getBoundingClientRect();mx=(ev.clientX-r.left);my=(ev.clientY-r.top);hov=null;nodes.forEach(function(n){var dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<14)hov=n.id;});c.style.cursor=hov!==null?"pointer":"default";if(drag){drag.x=mx;drag.y=my;}var tip=document.getElementById("tip");if(hov!==null){var n=nodes[hov];tip.textContent=n.type.toUpperCase()+" : "+n.label;tip.style.left=mx+12+"px";tip.style.top=my-8+"px";tip.classList.add("show");}else{tip.classList.remove("show");}});
c.addEventListener("mousedown",function(){if(hov!==null){drag=nodes[hov];sel=hov;showSidebar(nodes[hov]);}});
c.addEventListener("mouseup",function(){drag=null;});
c.addEventListener("mouseleave",function(){drag=null;document.getElementById("tip").classList.remove("show");});
function showSidebar(n){var sb=document.getElementById("sb");sb.classList.remove("hidden");document.getElementById("sb-type").textContent=n.type;document.getElementById("sb-name").textContent=n.label;var pp=document.getElementById("sb-props");pp.innerHTML="";var props=["id: "+n.id,"type: "+n.type];props.forEach(function(p){var d=document.createElement("div");d.className="sb-prop";d.textContent=p;pp.appendChild(d);});var cc=document.getElementById("sb-conns");cc.innerHTML="";edges.forEach(function(e){var other=null;if(e.s===n.id)other=nodes[e.t];else if(e.t===n.id)other=nodes[e.s];if(other){var d=document.createElement("div");d.className="sb-conn";d.innerHTML='<div class="sb-cdot" style="background:'+colors[other.type]+'"></div><span class="sb-cname">'+other.label+'</span><span class="sb-carrow">→</span>';d.onclick=function(){sel=other.id;showSidebar(other);};cc.appendChild(d);}});}
function closeSidebar(){document.getElementById("sb").classList.add("hidden");sel=null;}
window.addEventListener("resize",function(){resize();ctx.scale(2,2);});
</script>
</body>
</html>
